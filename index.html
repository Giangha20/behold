<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vọng Âm Đám Đông | Echoes of the Crowd</title>
  <meta name="description" content="Trò chơi quan sát xã hội và châm biếm truyền thông tương tác 2D." />
  <!-- Google Fonts với hỗ trợ tiếng Việt đầy đủ (Zero font error) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./assets/html.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
  </div>
  <script>
    if (location.hostname.endsWith('github.io') || location.protocol === 'file:') {
      // Khi chạy trực tiếp trên GitHub Pages không có Node/Vite build server
      var s = document.createElement('script');
      s.type = 'module';
      s.crossOrigin = 'anonymous';
      s.src = './assets/index.js';
      document.body.appendChild(s);
    } else {
      // Khi chạy trong môi trường phát triển Vite (localhost)
      var s = document.createElement('script');
      s.type = 'module';
      s.src = './src/main.ts';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
